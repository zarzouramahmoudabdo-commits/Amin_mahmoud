name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Point app to GitHub Pages
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          OWNER=$(echo "$OWNER" | tr A-Z a-z)
          node -e "const f='capacitor.config.json',c=require('./'+f);c.server={url:'https://$OWNER.github.io/$REPO/'};require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - run: npx cap add android
      - name: Icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for p in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $p; d=android/app/src/main/res/mipmap-$1
            convert assets/icon.png -resize ${2}x${2} $d/ic_launcher.png
            cp $d/ic_launcher.png $d/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Amin-Mahmoud-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
