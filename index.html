<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Amin Mahmoud</title>
<style>
:root{--bg:#070b16;--card:#101a30;--gold:#f2b632;--tx:#eef1f8;--mu:#8e9ab5;--ok:#35c27a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding-bottom:76px}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:linear-gradient(#142244,#070b16);border-bottom:1px solid #1f2d4d}
header img{width:44px;height:44px;border-radius:12px}header b{font-size:18px;color:var(--gold);display:block}header small{color:var(--mu);font-size:12px}
header div{flex:1}#up{background:#1a2848;color:var(--gold);border:1px solid #2a3d6b;border-radius:12px;padding:10px 12px;font-size:14px}
main{padding:16px;max-width:560px;margin:auto}h2{margin:6px 0}.m{color:var(--mu);font-size:14px}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #2a3d6b;background:#0b1224;color:var(--tx);font-size:16px;margin:6px 0}
.row{display:flex;gap:8px}.row input{flex:1}.b{background:linear-gradient(135deg,#ffe08a,#f2b632 60%,#b9780f);color:#1a1200;border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px;margin:6px 0}
.b.w{width:100%}.card{background:var(--card);border:1px solid #1f2d4d;border-radius:16px;padding:14px;margin:12px 0}
.tag{background:#1a2848;color:var(--gold);border-radius:8px;padding:2px 8px;font-size:13px}.st{font-size:20px;font-weight:700;color:var(--gold);margin:10px 0}
.steps{display:flex;gap:5px;margin-top:10px}.steps i{flex:1;height:7px;border-radius:4px;background:#22305a}.steps i.d{background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chips span{padding:9px 13px;border-radius:20px;border:1px solid #2a3d6b;background:#0b1224;font-size:14px}.chips span.on{background:var(--gold);color:#1a1200;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a1122;border-top:1px solid #1f2d4d;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:15px 4px;background:none;border:0;color:var(--mu);font-size:15px}nav button.on{color:var(--gold);font-weight:700}
.warn{background:#3a2c08;color:#ffd978;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:8px}
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1200;padding:10px 18px;border-radius:20px;font-weight:700;display:none;z-index:9}
.wa{background:#1fa855;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px}.ft{text-align:center;color:var(--mu);font-size:12px;margin:20px 0}
a.wa{text-decoration:none;display:inline-block}#rc{position:fixed;inset:0;background:rgba(0,0,0,.85);overflow:auto;padding:16px;z-index:20}@media print{body>*:not(#rc){display:none!important}#rc{position:static;background:#fff}#rc .row{display:none}}#sp{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 38%,#1b2a4a,#070b16 70%);animation:spOut .5s ease 1.9s forwards}
#sp img{width:120px;height:120px;border-radius:28px;box-shadow:0 0 60px rgba(242,182,50,.35);animation:spIn .9s ease both}
#sp b{font-size:32px;color:var(--gold);letter-spacing:1px;animation:spIn .9s ease .2s both}
#sp small{color:var(--mu);animation:spIn .9s ease .4s both}
#sp i{width:120px;height:3px;border-radius:3px;background:#22305a;overflow:hidden;position:relative;animation:spIn .9s ease .5s both}
#sp i::after{content:"";position:absolute;inset:0;width:40%;background:var(--gold);animation:spBar 1.1s ease-in-out infinite alternate}
@keyframes spIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@keyframes spBar{to{transform:translateX(150%)}}
#ad{display:flex;align-items:center;background:linear-gradient(90deg,#0f1b36,#16264a 50%,#0f1b36);border-bottom:1px solid #2a3d6b;box-shadow:0 6px 22px rgba(242,182,50,.07);position:relative;overflow:hidden}
#ad:before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.adb{flex:none;padding:7px 12px;margin:7px 8px;border-radius:999px;background:linear-gradient(135deg,#ffe08a,#f2b632 60%,#b9780f);color:#1a1200;font-weight:800;font-size:13px;animation:adp 2s ease-in-out infinite;z-index:1}
.adw{flex:1;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
#tk{display:flex;width:max-content;animation:adm 30s linear infinite}
#tk span{padding:0 22px;font-size:15px;color:var(--tx);font-weight:600}
#tk span:after{content:"✦";color:var(--gold);margin-inline-start:44px}
#ad:active #tk{animation-play-state:paused}
@keyframes adm{to{transform:translateX(50%)}}
@keyframes adp{50%{box-shadow:0 0 0 6px rgba(242,182,50,.18)}}
@media (prefers-reduced-motion:reduce){#tk{animation:none}}
</style></head><body><div id="sp"><img src="icon-192.png" alt=""><b>Amin Mahmoud</b><small>مركز صيانة الموبايلات</small><i></i></div>
<script>try{if(sessionStorage.sp)document.getElementById('sp').remove();else sessionStorage.sp=1}catch(e){}</script>
<header><img src="icon-192.png" alt=""><div><b>Amin Mahmoud</b><small>مركز صيانة الموبايلات</small></div><button id="up">🔄 تحديث</button></header>
<div id="ad"><span class="adb">📢</span><div class="adw"><div id="tk"></div></div></div>
<main id="v"></main>
<nav><button data-t="track">تتبع جهازي</button><button data-t="ask">استفسار</button><button data-t="adm">الإدارة</button></nav>
<div id="toast"></div>
<script src="config.js"></script><script src="qr.js"></script>
<script>
const C=window.CFG,ok=!!(C.SUPABASE_URL&&C.SUPABASE_KEY),V=document.getElementById('v');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={received:'تم الاستلام',checking:'جاري الفحص',waiting_part:'في انتظار قطعة غيار',repairing:'جاري الإصلاح',ready:'جاهز للاستلام ✅',delivered:'تم التسليم'};
const KEYS=Object.keys(ST);
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)};
let token=localStorage.getItem('tk')||'',ORD=[];
const isAdm=()=>!!token;
async function sb(p,o={},r=0){const h={apikey:C.SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=representation',...(o.headers||{})};const a=token||(C.SUPABASE_KEY.startsWith('eyJ')?C.SUPABASE_KEY:'');if(a)h.Authorization='Bearer '+a;
 const x=await fetch(C.SUPABASE_URL+p,{...o,headers:h});
 if(x.status==401&&!r&&localStorage.rt){token='';try{const t=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:localStorage.rt})},1);token=t.access_token;localStorage.tk=token;localStorage.rt=t.refresh_token;return sb(p,o,1)}catch(e){}}
 if(!x.ok)throw new Error(await x.text());return x.status==204?null:x.json()}
const db={
 async track(n,p){const r=await sb('/rest/v1/rpc/track_order',{method:'POST',body:JSON.stringify({n:+n,p:String(p)})});return r[0]},
 list:()=>sb('/rest/v1/orders?order=created_at.desc'),
 add:async o=>(await sb('/rest/v1/orders',{method:'POST',body:JSON.stringify(o)}))[0],
 upd:(o,p)=>sb('/rest/v1/orders?id=eq.'+o.id,{method:'PATCH',body:JSON.stringify({...p,updated_at:new Date().toISOString()})}),
 get:(t,q='')=>sb('/rest/v1/'+t+q),
 ins:(t,o)=>sb('/rest/v1/'+t,{method:'POST',body:JSON.stringify(o)}),
 pat:(t,id,o)=>sb('/rest/v1/'+t+'?id=eq.'+id,{method:'PATCH',body:JSON.stringify(o)}),
 del:(t,id)=>sb('/rest/v1/'+t+'?id=eq.'+id,{method:'DELETE'}),
 ups:(t,o)=>sb('/rest/v1/'+t+'?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(o)})
};
const wa=(num,txt)=>'https://wa.me/'+num+'?text='+encodeURIComponent(txt);
const intl=p=>{p=String(p||'').replace(/\D/g,'');return p.startsWith('0')?'20'+p.slice(1):p};

function go(t){if(!ok){V.innerHTML='<div class="card">التطبيق غير مربوط بقاعدة البيانات بعد، أضف مفاتيح Supabase في config.js.</div>';return}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));({track:rTrack,ask:rAsk,adm:rAdm})[t]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));

const fmt=h=>h==0?'12 منتصف الليل':h<12?h+' صباحًا':h==12?'12 ظهرًا':(h-12)+' مساءً',SH={addr:C.ADDRESS||'العباسي، شارع الصاغة، محل الحبيب',open:C.OPEN??10,close:C.CLOSE??23};
function shopCard(){const t=new Date(),h=t.getHours()+t.getMinutes()/60,o=h>=SH.open&&h<SH.close,mp=C.MAP||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(SH.addr);
 return '<div class="card"><b>Amin Mahmoud</b> <span class="tag">'+(o?'🟢 مفتوح الآن':'🔴 مقفول دلوقتي')+'</span><p class="m">📍 '+esc(SH.addr)+'</p><p class="m">🕙 من '+fmt(SH.open)+' إلى '+fmt(SH.close)+' • '+(o?'بنقفل الساعة '+fmt(SH.close):'بنفتح الساعة '+fmt(SH.open))+'</p><div class="row"><a class="wa" href="tel:+'+C.WHATSAPP+'">📞 اتصال</a><a class="wa" href="https://wa.me/'+C.WHATSAPP+'">💬 واتساب</a><a class="wa" href="'+mp+'">📍 الاتجاهات</a></div></div>'}
function rTrack(){
 V.innerHTML=shopCard()+'<h2>تابع جهازك</h2><p class="m">اكتب رقم الإيصال وآخر 4 أرقام من موبايلك</p><input id="n" type="number" inputmode="numeric" placeholder="رقم الإيصال"><input id="p" type="tel" inputmode="numeric" maxlength="4" placeholder="آخر 4 أرقام من موبايلك"><button class="b w" id="g">بحث</button><div id="r"></div>'+'<div class="ft">الإصدار '+esc(C.VERSION)+'</div>';
 const hm=location.hash.match(/n=(\d+)/);if(hm)$('#n').value=hm[1];$('#g').onclick=async()=>{const n=$('#n').value,p=$('#p').value.replace(/\D/g,'');if(!n||p.length<4)return toast('اكتب الرقم وآخر 4 أرقام');$('#r').innerHTML='<p class="m">جاري البحث...</p>';
  try{const o=await db.track(n,p);if(!o){$('#r').innerHTML='<div class="card">مفيش جهاز بالبيانات دي، تأكد من الرقم وآخر 4 أرقام.</div>';return}
   const i=KEYS.indexOf(o.status),k=KEYS.slice(0,5);
   $('#r').innerHTML='<div class="card"><b>'+esc(o.device)+'</b> <span class="tag">#'+o.num+'</span><div class="st">'+ST[o.status]+'</div>'+(o.note?'<p>'+esc(o.note)+'</p>':'')+(o.price?'<p class="m">التكلفة: '+esc(o.price)+' جنيه'+(+o.deposit?' • العربون: '+esc(o.deposit)+' • المتبقي: '+(o.price-o.deposit):'')+'</p>':'')+(o.warranty_until?'<p class="m">🛡️ الضمان حتى '+esc(o.warranty_until)+'</p>':'')+'<div class="steps">'+k.map((x,j)=>'<i class="'+(j<=i?'d':'')+'"></i>').join('')+'</div></div>'}
  catch(e){$('#r').innerHTML='<div class="card">تعذر الاتصال، جرّب تاني.</div>'}}
}

const BR={Apple:['iPhone 11','iPhone 12','iPhone 13','iPhone 14','iPhone 15','iPhone 16'],Samsung:['Galaxy A15','Galaxy A25','Galaxy A55','Galaxy S23','Galaxy S24'],Xiaomi:['Redmi Note 12','Redmi Note 13','Redmi 13C','Poco X6'],Oppo:['A17','A38','Reno 11'],Realme:['C55','C67','11 Pro'],Vivo:['Y17s','Y36','V29'],Huawei:['Y9','Nova 9'],Infinix:['Hot 40','Note 30'],Tecno:['Spark 20','Camon 20'],'أخرى':[]};
const IS=['شاشة','بطارية','شاحن / بورت شحن','سوفت وير','كاميرا','سماعة / ميكروفون','دخل عليه مياه','عطل تاني'];
let PR=[];
async function showP(){const m=$('#md').value.trim(),is=[...document.querySelectorAll('#ch .on')].map(s=>s.textContent);PR=[];$('#pq').innerHTML='';if(!m||!is.length)return;
 try{const r=await db.get('prices','?model=ilike.'+encodeURIComponent(m));PR=is.map(i=>{const x=r.find(y=>y.issue==i);return x?i+': '+x.price+' جنيه':''}).filter(Boolean);if(PR.length)$('#pq').innerHTML='<div class="card">💰 السعر التقريبي<br>'+PR.join('<br>')+'</div>'}catch(e){}}
function rAsk(){
 V.innerHTML='<h2>استفسار سريع</h2><p class="m">اختار جهازك والعطل وهيوصلنا على واتساب فورًا</p><select id="br">'+Object.keys(BR).map(b=>'<option>'+b+'</option>').join('')+'</select><input id="md" list="ml" placeholder="الموديل"><datalist id="ml"></datalist><div class="chips" id="ch">'+IS.map(x=>'<span>'+x+'</span>').join('')+'</div><div id="pq"></div><button class="b w" id="sd">إرسال على واتساب</button>';
 const fill=()=>{$('#ml').innerHTML=BR[$('#br').value].map(m=>'<option value="'+m+'">').join('');$('#md').value=''};fill();$('#br').onchange=fill;$('#md').oninput=showP;
 document.querySelectorAll('#ch span').forEach(s=>s.onclick=()=>{s.classList.toggle('on');showP()});
 $('#sd').onclick=()=>{const is=[...document.querySelectorAll('#ch .on')].map(s=>s.textContent);if(!$('#md').value||!is.length)return toast('اختار الموديل والعطل');
  location.href=wa(C.WHATSAPP,'استفسار صيانة\nالجهاز: '+$('#br').value+' '+$('#md').value+'\nالعطل: '+is.join('، ')+(PR.length?'\nالسعر التقريبي: '+PR.join('، '):''))}
}

const ALLM=Object.values(BR).flat(),num=x=>+x||0,sum=(a,f)=>a.reduce((s,x)=>s+num(f(x)),0);
let AT='orders',EXP=[],PRT=[],PRC=[];
function rcpt(o){const u=location.origin+location.pathname+'#n='+o.num,q=qrcode(0,'M');q.addData(u);q.make();
 const d=document.createElement('div');d.id='rc';
 d.innerHTML='<div class="card" style="background:#fff;color:#000;text-align:center"><b>Amin Mahmoud</b><p style="font-size:12px">'+esc(SH.addr)+'</p><p>إيصال استلام #'+o.num+'</p><p>'+esc(o.device)+' - '+esc(o.issue)+'</p>'+(o.accessories?'<p>الملحقات: '+esc(o.accessories)+'</p>':'')+(num(o.deposit)?'<p>العربون: '+o.deposit+' جنيه</p>':'')+q.createSvgTag(5)+'<p style="font-size:12px">امسح الكود لمتابعة جهازك (وأدخل آخر 4 أرقام من موبايلك)</p></div><div class="row"><button class="wa" id="rw">واتساب للعميل</button><button class="wa" id="rp">طباعة</button><button class="wa" id="rx">إغلاق</button></div>';
 document.body.appendChild(d);
 $('#rx').onclick=()=>d.remove();$('#rp').onclick=()=>print();
 $('#rw').onclick=()=>{location.href=wa(intl(o.phone),'إيصال استلام #'+o.num+'\nالجهاز: '+o.device+'\nتابع جهازك: '+u+'\nAmin Mahmoud')}}
function rAdm(){
 if(!isAdm()){V.innerHTML='<h2>دخول الإدارة</h2><input id="em" type="email" placeholder="الإيميل"><input id="pw" type="password" placeholder="الباسورد"><button class="b w" id="lg">دخول</button>';
  $('#lg').onclick=async()=>{try{const r=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value})});token=r.access_token;localStorage.tk=token;localStorage.rt=r.refresh_token;rAdm()}catch(e){toast('بيانات غير صحيحة')}};return}
 V.innerHTML='<div class="row"><h2 style="flex:1">لوحة الإدارة</h2><button class="wa" id="lo">خروج</button></div><div class="chips" id="tb">'+[['orders','الأجهزة'],['rep','التقارير'],['parts','المخزن'],['prices','الأسعار'],['ads','الإعلانات']].map(([k,t])=>'<span data-k="'+k+'" class="'+(AT==k?'on':'')+'">'+t+'</span>').join('')+'</div><div id="pn"></div>';
 $('#lo').onclick=()=>{token='';localStorage.removeItem('tk');localStorage.removeItem('rt');rAdm()};
 document.querySelectorAll('#tb span').forEach(s=>s.onclick=()=>{AT=s.dataset.k;rAdm()});
 ({orders:pOrders,rep:pRep,parts:pParts,prices:pPrices,ads:pAds})[AT]()}
function pOrders(){
 $('#pn').innerHTML='<div class="card"><b>جهاز جديد</b><input id="nm" type="number" inputmode="numeric" placeholder="رقم الإيصال (انت اللي تحدده)"><input id="cn" placeholder="اسم العميل"><input id="cp" type="tel" placeholder="رقم موبايل العميل"><input id="dv" list="am" placeholder="الجهاز (مثال: iPhone 15)"><datalist id="am">'+ALLM.map(m=>'<option value="'+m+'">').join('')+'</datalist><input id="is" placeholder="العطل"><div class="row"><input id="pr" type="number" placeholder="التكلفة"><input id="dp" type="number" placeholder="العربون"></div><input id="wd" type="number" value="30" placeholder="مدة الضمان بالأيام"><div class="chips" id="ac">'+['شاحن','شريحة','جراب','كارت ميموري'].map(x=>'<span>'+x+'</span>').join('')+'</div><button class="b w" id="ad">تسجيل واستلام الجهاز</button></div><div class="row"><input id="q" placeholder="بحث بالرقم أو الاسم أو الجهاز أو الموبايل"><select id="f" style="width:auto"><option value="">الكل</option>'+KEYS.map(k=>'<option value="'+k+'">'+ST[k]+'</option>').join('')+'</select></div><button class="wa" id="ex">نسخ كل البيانات (CSV)</button><div id="ls"></div>';
 document.querySelectorAll('#ac span').forEach(s=>s.onclick=()=>s.classList.toggle('on'));
 $('#ad').onclick=async()=>{if(!$('#nm').value||!$('#dv').value||$('#cp').value.replace(/\D/g,'').length<4)return toast('اكتب رقم الإيصال والجهاز وموبايل العميل');
  try{const o=await db.add({num:+$('#nm').value,customer:$('#cn').value,phone:$('#cp').value,device:$('#dv').value,issue:$('#is').value,price:$('#pr').value||null,deposit:num($('#dp').value),warranty_days:num($('#wd').value),accessories:[...document.querySelectorAll('#ac .on')].map(s=>s.textContent).join('، ')});
   ['nm','cn','cp','dv','is','pr','dp'].forEach(i=>$('#'+i).value='');document.querySelectorAll('#ac .on').forEach(s=>s.classList.remove('on'));await load();rcpt(o)}
  catch(e){toast(/duplicate|23505/.test(e.message)?'رقم الإيصال ده مستخدم قبل كده':'خطأ في الحفظ')}};
 $('#q').oninput=draw;$('#f').onchange=draw;
 $('#ex').onclick=async()=>{const rows=[['رقم','العميل','الموبايل','الجهاز','العطل','الحالة','التكلفة','العربون','التاريخ']].concat(ORD.map(o=>[o.num,o.customer,o.phone,o.device,o.issue,ST[o.status],o.price??'',o.deposit??'',(o.created_at||'').slice(0,10)]));
  const c=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');try{await navigator.clipboard.writeText(c);toast('تم النسخ، الصقه في Excel أو الملاحظات')}catch(e){toast('تعذر النسخ')}};
 load()}
async function load(){try{ORD=await db.list()}catch(e){token='';localStorage.removeItem('tk');return rAdm()}if($('#ls'))draw()}
function draw(){const q=$('#q').value.trim().toLowerCase(),f=$('#f').value,cnt={};ORD.forEach(o=>cnt[o.phone]=(cnt[o.phone]||0)+1);
 const rows=ORD.map((o,i)=>[o,i]).filter(([o])=>(!f||o.status==f)&&(!q||[o.num,o.customer,o.device,o.phone].join(' ').toLowerCase().includes(q)));
 $('#ls').innerHTML=rows.map(([o,i])=>{const late=o.status=='ready'&&Date.now()-new Date(o.updated_at)>6048e5;

 document.querySelectorAll('[data-sv]').forEach(b=>b.onclick=async()=>{const i=b.dataset.sv,o=ORD[i],st=$('#s'+i).value,p={status:st,note:$('#t'+i).value,price:$('#p'+i).value||null,deposit:num($('#d'+i).value)};if(st=='delivered'&&!o.delivered_at)p.delivered_at=new Date().toISOString();

async function pRep(){const P=$('#pn');P.innerHTML='<p class="m">جاري التحميل...</p>';
 try{ORD=await db.list();EXP=await db.get('expenses','?order=created_at.desc')}catch(e){return toast('خطأ في التحميل')}
 const per=window.RP||'d',n=new Date(),st=per=='d'?new Date(n.getFullYear(),n.getMonth(),n.getDate()):new Date(n.getFullYear(),n.getMonth(),1),inP=d=>new Date(d)>=st;
 const dl=ORD.filter(o=>o.status=='delivered'&&inP(o.delivered_at||o.updated_at)),ex=EXP.filter(e=>inP(e.created_at));
 const rev=sum(dl,o=>o.price),exs=sum(ex,e=>e.amount),pend=sum(ORD.filter(o=>o.status!='delivered'),o=>o.deposit),top={};
 ORD.filter(o=>inP(o.created_at)).forEach(o=>top[o.issue]=(top[o.issue]||0)+1);
 const tl=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
 P.innerHTML='<select id="rp1"><option value="d"'+(per=='d'?' selected':'')+'>اليوم</option><option value="m"'+(per=='m'?' selected':'')+'>الشهر</option></select><div class="card"><p class="m">الإيراد (أجهزة اتسلمت)</p><div class="st">'+rev+' جنيه</div><p class="m">المصروفات: '+exs+' • صافي الربح: <b>'+(rev-exs)+'</b></p><p class="m">أجهزة اتسلمت: '+dl.length+' • عربون أجهزة لسه عندك: '+pend+'</p></div><div class="card"><b>أكتر الأعطال</b>'+(tl.map(([k,v])=>'<p class="m">'+esc(k)+' ×'+v+'</p>').join('')||'<p class="m">لا بيانات</p>')+'</div><div class="card"><b>مصروف جديد</b><input id="et" placeholder="البند (إيجار، قطعة، كهرباء...)"><input id="ea" type="number" placeholder="المبلغ"><button class="b w" id="eb">إضافة</button></div>'+ex.map(e=>'<div class="card">'+esc(e.title)+' <b>'+e.amount+'</b> جنيه <button class="wa" data-de="'+e.id+'">حذف</button></div>').join('');
 $('#rp1').onchange=()=>{window.RP=$('#rp1').value;pRep()};
 $('#eb').onclick=async()=>{if(!$('#ea').value)return toast('اكتب المبلغ');try{await db.ins('expenses',{title:$('#et').value,amount:+$('#ea').value});pRep()}catch(e){toast('خطأ')}};
 document.querySelectorAll('[data-de]').forEach(b=>b.onclick=async()=>{try{await db.del('expenses',b.dataset.de);pRep()}catch(e){toast('خطأ')}})}
async function pParts(){const P=$('#pn');try{PRT=await db.get('parts','?order=name')}catch(e){return toast('خطأ في التحميل')}
 P.innerHTML='<div class="card"><b>قطعة جديدة</b><input id="ptn" placeholder="اسم القطعة (مثال: شاشة iPhone 13)"><div class="row"><input id="ptq" type="number" placeholder="الكمية"><input id="ptm" type="number" placeholder="حد التنبيه" value="2"></div><button class="b w" id="pa">إضافة</button></div>'+PRT.map((p,i)=>'<div class="card"><b>'+esc(p.name)+'</b> '+(p.qty<=p.min_qty?'<span class="tag">⚠️ قارب على النفاد</span>':'')+'<div class="st">'+p.qty+'</div><div class="row"><button class="b" data-pm="'+i+'">−1</button><button class="b" data-pp="'+i+'">+1</button><button class="wa" data-px="'+i+'">حذف</button></div></div>').join('');
 $('#pa').onclick=async()=>{if(!$('#ptn').value)return toast('اكتب اسم القطعة');try{await db.ins('parts',{name:$('#ptn').value,qty:num($('#ptq').value),min_qty:num($('#ptm').value)});pParts()}catch(e){toast('خطأ')}};
 const ch=(a,f)=>document.querySelectorAll('['+a+']').forEach(b=>b.onclick=async()=>{const p=PRT[b.getAttribute(a)];try{await f(p);pParts()}catch(e){toast('خطأ')}});
 ch('data-pm',p=>db.pat('parts',p.id,{qty:Math.max(0,p.qty-1)}));ch('data-pp',p=>db.pat('parts',p.id,{qty:p.qty+1}));ch('data-px',p=>db.del('parts',p.id))}
async function pPrices(){const P=$('#pn');try{PRC=await db.get('prices','?order=model')}catch(e){return toast('خطأ في التحميل')}
 P.innerHTML='<div class="card"><b>سعر جديد (بيظهر للعميل في الاستفسار)</b><input id="prm" list="am" placeholder="الموديل (زي iPhone 15)"><datalist id="am">'+ALLM.map(m=>'<option value="'+m+'">').join('')+'</datalist><select id="pri">'+IS.map(x=>'<option>'+x+'</option>').join('')+'</select><input id="prp" type="number" placeholder="السعر"><button class="b w" id="pra">إضافة</button></div>'+PRC.map(p=>'<div class="card">'+esc(p.model)+' • '+esc(p.issue)+' <b>'+esc(p.price)+'</b> جنيه <button class="wa" data-dp="'+p.id+'">حذف</button></div>').join('');
