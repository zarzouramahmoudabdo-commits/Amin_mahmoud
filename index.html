<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Amin Mahmoud</title>
<style>
:root{--bg:#070b16;--card:#101a30;--gold:#f2b632;--tx:#eef1f8;--mu:#8e9ab5;--ok:#35c27a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding-bottom:76px}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:linear-gradient(#142244,#070b16);border-bottom:1px solid #1f2d4d}
header img{width:44px;height:44px;border-radius:12px}header b{font-size:18px;color:var(--gold);display:block}header small{color:var(--mu);font-size:12px}
header div{flex:1}#up{background:#1a2848;color:var(--gold);border:1px solid #2a3d6b;border-radius:12px;padding:10px 12px;font-size:14px}
main{padding:16px;max-width:560px;margin:auto}h2{margin:6px 0}.m{color:var(--mu);font-size:14px}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #2a3d6b;background:#0b1224;color:var(--tx);font-size:16px;margin:6px 0}
.row{display:flex;gap:8px}.row input{flex:1}.b{background:linear-gradient(135deg,#ffe08a,#f2b632 60%,#b9780f);color:#1a1200;border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px;margin:6px 0}
.b.w{width:100%}.card{background:var(--card);border:1px solid #1f2d4d;border-radius:16px;padding:14px;margin:12px 0}
.tag{background:#1a2848;color:var(--gold);border-radius:8px;padding:2px 8px;font-size:13px}.st{font-size:20px;font-weight:700;color:var(--gold);margin:10px 0}
.steps{display:flex;gap:5px;margin-top:10px}.steps i{flex:1;height:7px;border-radius:4px;background:#22305a}.steps i.d{background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chips span{padding:9px 13px;border-radius:20px;border:1px solid #2a3d6b;background:#0b1224;font-size:14px}.chips span.on{background:var(--gold);color:#1a1200;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a1122;border-top:1px solid #1f2d4d;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:15px 4px;background:none;border:0;color:var(--mu);font-size:15px}nav button.on{color:var(--gold);font-weight:700}
.warn{background:#3a2c08;color:#ffd978;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:8px}
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1200;padding:10px 18px;border-radius:20px;font-weight:700;display:none;z-index:9}
.wa{background:#1fa855;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px}.ft{text-align:center;color:var(--mu);font-size:12px;margin:20px 0}
</style></head><body>
<header><img src="icon-192.png" alt=""><div><b>Amin Mahmoud</b><small>مركز صيانة الموبايلات</small></div><button id="up">🔄 تحديث</button></header>
<main id="v"></main>
<nav><button data-t="track">تتبع جهازي</button><button data-t="ask">استفسار</button><button data-t="adm">الإدارة</button></nav>
<div id="toast"></div>
<script src="config.js"></script>
<script>
const C=window.CFG,ok=!!(C.SUPABASE_URL&&C.SUPABASE_KEY),V=document.getElementById('v');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={received:'تم الاستلام',checking:'جاري الفحص',waiting_part:'في انتظار قطعة غيار',repairing:'جاري الإصلاح',ready:'جاهز للاستلام ✅',delivered:'تم التسليم'};
const KEYS=Object.keys(ST);
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)};
let token=localStorage.getItem('tk')||'',ORD=[];
const isAdm=()=>!!token;
async function sb(p,o={},r=0){const h={apikey:C.SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=representation',...(o.headers||{})};const a=token||(C.SUPABASE_KEY.startsWith('eyJ')?C.SUPABASE_KEY:'');if(a)h.Authorization='Bearer '+a;
 const x=await fetch(C.SUPABASE_URL+p,{...o,headers:h});
 if(x.status==401&&!r&&localStorage.rt){token='';try{const t=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:localStorage.rt})},1);token=t.access_token;localStorage.tk=token;localStorage.rt=t.refresh_token;return sb(p,o,1)}catch(e){}}
 if(!x.ok)throw new Error(await x.text());return x.status==204?null:x.json()}
const db={
 async track(n,p){const r=await sb('/rest/v1/rpc/track_order',{method:'POST',body:JSON.stringify({n:+n,p:String(p)})});return r[0]},
 list:()=>sb('/rest/v1/orders?order=created_at.desc'),
 async add(o){return(await sb('/rest/v1/orders',{method:'POST',body:JSON.stringify(o)}))[0]},
 upd:(o,p)=>sb('/rest/v1/orders?id=eq.'+o.id,{method:'PATCH',body:JSON.stringify({...p,updated_at:new Date().toISOString()})})
};
const wa=(num,txt)=>'https://wa.me/'+num+'?text='+encodeURIComponent(txt);
const intl=p=>{p=String(p||'').replace(/\D/g,'');return p.startsWith('0')?'20'+p.slice(1):p};

function go(t){if(!ok){V.innerHTML='<div class="card">التطبيق غير مربوط بقاعدة البيانات بعد، أضف مفاتيح Supabase في config.js.</div>';return}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));({track:rTrack,ask:rAsk,adm:rAdm})[t]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));

function rTrack(){
 V.innerHTML='<h2>تابع جهازك</h2><p class="m">اكتب رقم الإيصال وآخر 4 أرقام من موبايلك</p><input id="n" type="number" inputmode="numeric" placeholder="رقم الإيصال"><input id="p" type="tel" inputmode="numeric" maxlength="4" placeholder="آخر 4 أرقام من موبايلك"><button class="b w" id="g">بحث</button><div id="r"></div>'+'<div class="ft">الإصدار '+esc(C.VERSION)+'</div>';
 $('#g').onclick=async()=>{const n=$('#n').value,p=$('#p').value.replace(/\D/g,'');if(!n||p.length<4)return toast('اكتب الرقم وآخر 4 أرقام');$('#r').innerHTML='<p class="m">جاري البحث...</p>';
  try{const o=await db.track(n,p);if(!o){$('#r').innerHTML='<div class="card">مفيش جهاز بالبيانات دي، تأكد من الرقم وآخر 4 أرقام.</div>';return}
   const i=KEYS.indexOf(o.status),k=KEYS.slice(0,5);
   $('#r').innerHTML='<div class="card"><b>'+esc(o.device)+'</b> <span class="tag">#'+o.num+'</span><div class="st">'+ST[o.status]+'</div>'+(o.note?'<p>'+esc(o.note)+'</p>':'')+(o.price?'<p class="m">التكلفة: '+esc(o.price)+' جنيه</p>':'')+'<div class="steps">'+k.map((x,j)=>'<i class="'+(j<=i?'d':'')+'"></i>').join('')+'</div></div>'}
  catch(e){$('#r').innerHTML='<div class="card">تعذر الاتصال، جرّب تاني.</div>'}}
}

const BR={Apple:['iPhone 11','iPhone 12','iPhone 13','iPhone 14','iPhone 15','iPhone 16'],Samsung:['Galaxy A15','Galaxy A25','Galaxy A55','Galaxy S23','Galaxy S24'],Xiaomi:['Redmi Note 12','Redmi Note 13','Redmi 13C','Poco X6'],Oppo:['A17','A38','Reno 11'],Realme:['C55','C67','11 Pro'],Vivo:['Y17s','Y36','V29'],Huawei:['Y9','Nova 9'],Infinix:['Hot 40','Note 30'],Tecno:['Spark 20','Camon 20'],'أخرى':[]};
const IS=['شاشة','بطارية','شاحن / بورت شحن','سوفت وير','كاميرا','سماعة / ميكروفون','دخل عليه مياه','عطل تاني'];
function rAsk(){
 V.innerHTML='<h2>استفسار سريع</h2><p class="m">اختار جهازك والعطل وهيوصلنا على واتساب فورًا</p><select id="br">'+Object.keys(BR).map(b=>'<option>'+b+'</option>').join('')+'</select><input id="md" list="ml" placeholder="الموديل"><datalist id="ml"></datalist><div class="chips" id="ch">'+IS.map(x=>'<span>'+x+'</span>').join('')+'</div><button class="b w" id="sd">إرسال على واتساب</button>';
 const fill=()=>{$('#ml').innerHTML=BR[$('#br').value].map(m=>'<option value="'+m+'">').join('');$('#md').value=''};fill();$('#br').onchange=fill;
 document.querySelectorAll('#ch span').forEach(s=>s.onclick=()=>s.classList.toggle('on'));
 $('#sd').onclick=()=>{const is=[...document.querySelectorAll('#ch .on')].map(s=>s.textContent);if(!$('#md').value||!is.length)return toast('اختار الموديل والعطل');
  location.href=wa(C.WHATSAPP,'استفسار صيانة\nالجهاز: '+$('#br').value+' '+$('#md').value+'\nالعطل: '+is.join('، '))}
}

function rAdm(){
 if(!isAdm()){V.innerHTML='<h2>دخول الإدارة</h2><input id="em" type="email" placeholder="الإيميل"><input id="pw" type="password" placeholder="الباسورد"><button class="b w" id="lg">دخول</button>';
  $('#lg').onclick=async()=>{try{const r=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value})});token=r.access_token;localStorage.tk=token;localStorage.rt=r.refresh_token;rAdm()}catch(e){toast('بيانات غير صحيحة')}};return}
 V.innerHTML='<div class="row"><h2 style="flex:1">لوحة الإدارة</h2><button class="wa" id="lo">خروج</button></div><div class="card"><b>جهاز جديد</b><input id="nm" type="number" inputmode="numeric" placeholder="رقم الإيصال (انت اللي تحدده)"><input id="cn" placeholder="اسم العميل"><input id="cp" type="tel" placeholder="رقم موبايل العميل"><input id="dv" placeholder="الجهاز (مثال: iPhone 15)"><input id="is" placeholder="العطل"><input id="pr" type="number" placeholder="التكلفة (اختياري)"><button class="b w" id="ad">تسجيل واستلام الجهاز</button></div><div class="row"><input id="q" placeholder="بحث بالرقم أو الاسم أو الجهاز"><select id="f" style="width:auto"><option value="">الكل</option>'+KEYS.map(k=>'<option value="'+k+'">'+ST[k]+'</option>').join('')+'</select></div><div id="ls"></div>';
 $('#lo').onclick=()=>{token='';localStorage.removeItem('tk');localStorage.removeItem('rt');rAdm()};
 $('#ad').onclick=async()=>{if(!$('#nm').value||!$('#dv').value||$('#cp').value.replace(/\D/g,'').length<4)return toast('اكتب رقم الإيصال والجهاز وموبايل العميل');try{const o=await db.add({num:+$('#nm').value,customer:$('#cn').value,phone:$('#cp').value,device:$('#dv').value,issue:$('#is').value,price:$('#pr').value||null});toast('رقم الإيصال: '+o.num);['nm','cn','cp','dv','is','pr'].forEach(i=>$('#'+i).value='');load()}catch(e){toast(/duplicate|23505/.test(e.message)?'رقم الإيصال ده مستخدم قبل كده':'خطأ في الحفظ')}};
 $('#q').oninput=draw;$('#f').onchange=draw;load();
}
async function load(){try{ORD=await db.list()}catch(e){token='';localStorage.removeItem('tk');return rAdm()}draw()}
function draw(){const q=$('#q').value.trim().toLowerCase(),f=$('#f').value;
 const rows=ORD.map((o,i)=>[o,i]).filter(([o])=>(!f||o.status==f)&&(!q||[o.num,o.customer,o.device,o.phone].join(' ').toLowerCase().includes(q)));
 $('#ls').innerHTML=rows.map(([o,i])=>'<div class="card"><b>'+esc(o.device)+'</b> <span class="tag">#'+o.num+'</span><p class="m">'+esc(o.customer)+' • '+esc(o.issue)+'</p><select id="s'+i+'">'+KEYS.map(k=>'<option value="'+k+'"'+(k==o.status?' selected':'')+'>'+ST[k]+'</option>').join('')+'</select><input id="t'+i+'" placeholder="ملاحظة للعميل" value="'+esc(o.note)+'"><div class="row"><button class="b" data-sv="'+i+'">حفظ</button>'+(o.phone?'<button class="wa" data-wa="'+i+'">واتساب للعميل</button>':'')+'</div></div>').join('')||'<p class="m">مفيش نتائج.</p>';
 document.querySelectorAll('[data-sv]').forEach(b=>b.onclick=async()=>{const i=b.dataset.sv;try{await db.upd(ORD[i],{status:$('#s'+i).value,note:$('#t'+i).value});toast('تم الحفظ');load()}catch(e){toast('خطأ')}});
 document.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>{const o=ORD[b.dataset.wa];location.href=wa(intl(o.phone),'أهلًا '+(o.customer||'')+'\nجهازك ('+o.device+') رقم #'+o.num+'\nالحالة: '+ST[$('#s'+b.dataset.wa).value]+(o.price?'\nالتكلفة: '+o.price+' جنيه':'')+'\nAmin Mahmoud')})}

$('#up').onclick=async()=>{toast('جاري البحث عن تحديث...');
 try{const v=await(await fetch('version.json?'+Date.now(),{cache:'no-store'})).json();
  if(v.version===C.VERSION)return toast('أنت على آخر إصدار ('+C.VERSION+')');
  toast('تحديث جديد '+v.version+' ...');
  (await navigator.serviceWorker?.getRegistrations()||[]).forEach(r=>r.unregister());
  for(const k of await caches.keys())await caches.delete(k);
  setTimeout(()=>location.reload(),900)}
 catch(e){toast('تعذر التحديث، تأكد من الإنترنت')}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go('track');
</script></body></html>
